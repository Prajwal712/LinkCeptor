<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚠️ Link Blocked — Smart Link Interceptor</title>
  <link rel="stylesheet" href="warning.css">
</head>
<body>
  <div class="warning-container">
    <!-- Animated Background -->
    <div class="bg-grid"></div>
    <div class="bg-glow"></div>

    <!-- Main Card -->
    <div class="warning-card">
      <div class="warning-icon-wrapper">
        <div class="warning-icon-ring"></div>
        <div class="warning-icon">🚨</div>
      </div>

      <h1 class="warning-title">Suspicious Link Detected</h1>
      
      <p class="warning-subtitle">
        Smart Link Interceptor has flagged this link as potentially dangerous.
      </p>

      <div class="threat-details">
        <div class="detail-row">
          <span class="detail-label">Blocked URL</span>
          <code class="detail-value" id="blocked-url">—</code>
        </div>
        <div class="detail-row">
          <span class="detail-label">Threat Reason</span>
          <span class="detail-value threat-reason" id="threat-reason">—</span>
        </div>
      </div>

      <div class="warning-actions">
        <button id="btn-go-back" class="btn btn-primary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          Go Back to Safety
        </button>
        <button id="btn-proceed" class="btn btn-danger">
          Proceed Anyway (Risky)
        </button>
      </div>

      <div class="warning-disclaimer">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="16" x2="12" y2="12"></line>
          <line x1="12" y1="8" x2="12.01" y2="8"></line>
        </svg>
        <span>Analysis powered by Gemini AI. Exercise your own judgment.</span>
      </div>
    </div>
  </div>

  <script src="warning.js"></script>
</body>
</html>
