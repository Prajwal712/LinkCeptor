# ═══════════════════════════════════════════════════════════
#  Smart Link Interceptor — Nginx Load Balancer Configuration
# ═══════════════════════════════════════════════════════════
#
#  Distributes incoming requests across multiple server instances
#  using least-connections algorithm with health checking.
#
#  Architecture:
#
#    Client Request → Nginx :80
#                       │
#              ┌────────┼────────┐
#              │        │        │
#           server:3001 (Instance 1)
#           server:3001 (Instance 2)
#           server:3001 (Instance 3)
#
# ═══════════════════════════════════════════════════════════

worker_processes auto;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    # ─── Upstream: Server Pool ─────────────────────────────
    # Docker Compose DNS resolves 'server' to all replicas.
    # least_conn ensures requests go to the least busy server.
    upstream sli_backend {
        least_conn;
        server server:3001;
    }

    # ─── Rate Limiting Zone ────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    # ─── Logging ───────────────────────────────────────────
    log_format main '$remote_addr - [$time_local] "$request" '
                    '$status $body_bytes_sent '
                    '"$http_referer" "$upstream_addr" '
                    'rt=$request_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # ─── Performance ───────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    gzip on;
    gzip_types application/json;

    server {
        listen 80;
        server_name _;

        # ─── CORS Headers ─────────────────────────────────
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;

        # Custom header to identify load balancer
        add_header X-Served-By "SLI-LoadBalancer" always;

        # ─── CORS Preflight ───────────────────────────────
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type" always;
            add_header Content-Length 0;
            return 204;
        }

        # ─── API Routes → Backend Pool ────────────────────
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;

            proxy_pass http://sli_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Timeouts for external API calls (VT, GSB can take time)
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            # Retry on failure — try next server
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
        }

        # ─── Root → Backend ───────────────────────────────
        location / {
            proxy_pass http://sli_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ─── Load Balancer Health ─────────────────────────
        location /nginx-health {
            access_log off;
            return 200 '{"status":"ok","service":"SLI-LoadBalancer"}';
            add_header Content-Type application/json;
        }
    }
}
